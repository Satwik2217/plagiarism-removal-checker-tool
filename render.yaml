services:
  - type: web
    name: pcfa-server
    env: node
    plan: starter
    nodeVersion: 18
    buildCommand: npm run build
    startCommand: npm start
    rootDir: .
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://YOUR-RENDER-URL.onrender.com
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-3.5-turbo
      - key: OPENAI_API_KEY
        from: secret:openai_api_key
      - key: ANTHROPIC_API_KEY
        from: secret:anthropic_api_key
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama2
    healthCheckPath: /api/health
    autoDeploy: true
    regions:
      - us-east-1
